            padding: 15px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

            background: #4338ca;
            transform: translateY(-1px);
        }

        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

            border-radius: 12px;

            overflow-y: auto;
            font-family: 'Fira Code', monospace;

            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);

        .status-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            background: #f8fafc;
        }

        .success {
            color: #16a34a;
            font-weight: bold;
        }

        .error {
            color: #dc2626;
            font-weight: bold;
        }

        .loading {

        const STUDENTS_BY_CLASS = {

        async function init() {
            const statusEl = document.getElementById('conn-status');
            const retryBtn = document.getElementById('btn-retry');
            statusEl.innerHTML = '<span class="loading">🔄 Testando conexão com Supabase...</span>';
            statusEl.className = 'status-box loading';
            retryBtn.style.display = 'none';

            log("Tentando inicializar Supabase...");

            try {
                if (!window.supabase) {
                    log("Aguardando carregamento da biblioteca Supabase...", "warn");
                    // Tentar novamente em 2 segundos
                    setTimeout(init, 2000);
                    return;
                }

                supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
                log("Cliente Supabase criado. Testando tabelas...");

                // Teste simplificado: apenas ver se a tabela existe
                const { error } = await supabase.from('teachers').select('id').limit(1);

                if (error) {
                    log(`Erro de conexão: ${error.message}`, "error");
                    statusEl.innerHTML = `<span class="error">❌ Erro: ${error.message}</span>`;
                    statusEl.className = 'status-box';
                    retryBtn.style.display = 'block';
                } else {
                    log("✅ Conexão estabelecida com sucesso!", "success");
                    statusEl.innerHTML = `<span class="success">✅ Conectado ao Cofre</span>`;
                    statusEl.className = 'status-box';
                    document.getElementById('btn-restore').disabled = false;
                }
            } catch (err) {
                log(`Falha crítica: ${err.message}`, "error");
                statusEl.innerHTML = `<span class="error">💥 Falha: ${err.message}</span>`;
                statusEl.className = 'status-box';
                retryBtn.style.display = 'block';
            }
        }

        async function startRestoration() {
            if (!confirm("Isso irá APAGAR os dados atuais do banco e inserir a nova lista. Tem certeza?")) return;

            const btn = document.getElementById('btn-restore');
            btn.disabled = true;
            btn.innerHTML = "RESTAURANDO... AGUARDE";

            log("🚀 INICIANDO LIMPEZA DE DADOS...");

            try {
                // 1. Limpar (Delete)
                log("🗑️ Removendo registros antigos...");
                await supabase.from('disciplines').delete().neq('discipline_id', '0');
                await supabase.from('students').delete().neq('id', '0');
                await supabase.from('teachers').delete().neq('id', '0');

                // 2. Professores
                log("👨‍🏫 Enviando 20 Professores...");
                const { error: e1 } = await supabase.from('teachers').upsert(TEACHERS);
                if (e1) throw e1;

                // 3. Disciplinas
                const discArray = Object.values(TEACHER_DISCIPLINES).flat().map(d => ({
                    discipline_id: d.id,
                    discipline_name: d.name,
                    teacher_id: d.id.split('-')[0], // Simples extração do ID do professor
                    classes: d.classes
                }));
                log(`📚 Enviando ${discArray.length} ligações de disciplinas...`);
                const { error: e2 } = await supabase.from('disciplines').upsert(discArray);
                if (e2) throw e2;

                // 4. Alunos
                log("👥 Enviando alunos por turma...");
                let total = 0;
                for (const [className, students] of Object.entries(STUDENTS_BY_CLASS)) {
                    const data = students.map((name, i) => ({
                        id: `${className.replace(/\s+/g, '-').toLowerCase()}-${i + 1}`,
                        name: name,
                        class: className,
                        active: true
                    }));
                    const { error } = await supabase.from('students').upsert(data);
                    if (error) log(`Erro na turma ${className}: ${error.message}`, "error");
                    else {
                        total += data.length;
                        log(`✅ ${data.length} alunos salvos em ${className}`);
                    }
                }

                log(`🎉 SUCESSO! ${total} alunos restaurados.`, "success");
                alert("DADOS RESTAURADOS COM SUCESSO!");
                btn.innerHTML = "CONCLUÍDO!";
            } catch (err) {
                log(`ERRO NA RESTAURAÇÃO: ${err.message}`, "error");
                alert("ERRO: " + err.message);
                btn.disabled = false;
                btn.innerHTML = "TENTAR NOVAMENTE";
            }
        }

        setTimeout(init, 1000);
