        // --- FUNÇÕES ---

        async function init() {
            try {
                if (!window.supabase) {
                    throw new Error("Biblioteca Supabase não carregou. Verifique a internet.");
                }
                supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

                const { count, error } = await supabase.from('teachers').select('*', { count: 'exact', head: true });
                if (error) throw error;
                document.getElementById('conn-status').innerHTML = `<span class="success">✅ Conectado ao Cofre (Supabase). ${count} Professores detectados.</span>`;
                document.getElementById('btn-restore').disabled = false;
            } catch (err) {
                document.getElementById('conn-status').innerHTML = `<span class="error">❌ Erro de Conexão: ${err.message}</span>`;
                log(JSON.stringify(err), 'error');
            }
        }

        async function startRestoration() {
            document.getElementById('btn-restore').disabled = true;
            log("🚀 INICIANDO RESTAURAÇÃO (Pelo Celular)...");

            // 1. Restaurar Professores
            log("📦 Enviando Professores...");
            for (const t of TEACHERS) {
                const { error } = await supabase.from('teachers').upsert(t);
                if (error) log(`Erro ao salvar ${t.name}: ${error.message}`, 'error');
                else log(`✅ Professor ${t.name} salvo/atualizado.`);
            }

            // 2. Restaurar Alunos e Disciplinas
            log("📦 Configurando Turmas e Alunos...");

            // Inserir Alunos
            for (const [className, studentNames] of Object.entries(STUDENTS_BY_CLASS)) {
                log(`Processando turma ${className}...`);
                const studentsData = studentNames.map((name, idx) => ({
                    id: `${className.replace(/\s+/g, '-').toLowerCase()}-${idx + 1}`,
                    name: name,
                    class: className,
                    active: true
                }));

                const { error: errAlunos } = await supabase.from('students').upsert(studentsData);
                if (errAlunos) log(`Erro alunos ${className}: ${errAlunos.message}`, 'error');
                else log(`✅ ${studentsData.length} alunos salvos em ${className}.`);
            }

            // Inserir Disciplinas (Ligação Professor -> Turma)
            log("📦 Vinculando Disciplinas...");
            for (const [teacherId, disciplines] of Object.entries(TEACHER_DISCIPLINES)) {
                for (const d of disciplines) {
                    const disciplineData = {
                        discipline_id: `${teacherId}-${d.id}`,
                        discipline_name: d.name,
                        teacher_id: teacherId,
                        classes: d.classes
                    };
                    const { error } = await supabase.from('disciplines').upsert(disciplineData);
                    if (error) log(`Erro disciplina ${d.name} (${teacherId}): ${error.message}`, 'error');
                }
            }

            log("🏁 RESTAURAÇÃO CONCLUÍDA! Pode fechar e abrir o App.", 'success');
            alert("Sucesso! Os dados foram enviados.");
        }

        window.addEventListener('load', init);
